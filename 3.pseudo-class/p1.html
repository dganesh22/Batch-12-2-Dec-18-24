<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* selector:pseudo_class {} */
        /* :hover */
        a:hover {
            padding: 10px 12px;
            background-color: green;
            color: #fff;
            text-decoration: none;
        }

        /* :active */
        a:active {
            padding: 10px 12px;
            background-color: slateblue;
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <h1>Pseudo class</h1>

    <div>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
    </div>
</body>

</html>
