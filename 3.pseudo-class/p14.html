<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ol li:nth-of-type(2n-1) {
            color: orange;
        }

        dd:nth-last-of-type(2n-1) {
            color: deeppink;
        }
    </style>
</head>

<body>
    <h1> :nth-last-of-type() </h1>

    <p>colors names</p>

    <ol reversed>
        <li>green</li>
        <li>white</li>
        <li>yellow</li>
        <li>gold</li>
        <li>black</li>
        <li>orange</li>
    </ol>

    <hr>

    <h3>nth-of-last-type</h3>
    <dl>
        <dt>Vegetables</dt>
        <dd>1.Tomoto</dd>
        <dd>2.Onion</dd>
        <dd>3.Mashroom</dd>

        <dt>Fruits</dt>
        <dd>4.Apple</dd>
        <dd>5.Grapes</dd>
        <dd>6.Orange</dd>
    </dl>
</body>

</html>
