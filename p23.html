<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Registration Form</h1>

    <form action="">
        <div>
            <label for="first">First Name:</label>
            <input type="text" name="first" id="first" placeholder="Enter First Name" required>
        </div>

        <div>
            <label for="last">Last Name:</label>
            <input type="text" name="last" id="last" placeholder="Enter Last Name" required>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="Enter Email Address" required>
        </div>

        <div>
            <label for="gender">Gender: </label><br>
            Male <input type="radio" name="gender" id="gender" value="male"> <br>
            Female <input type="radio" name="gender" id="gender" value="female"> <br>
            Other <input type="radio" name="gender" id="gender" value="other"> <br>
        </div>

        <div>
            <label for="age">Age:</label>
            <input type="number" name="age" id="age" required>
        </div>

        <div>
            <label for="pref">Preferences:</label><br>
            Acrylic Painting <input type="checkbox" name="pref" id="pref" value="Acrylic Painting"><br>
            Oil Painting <input type="checkbox" name="pref" id="pref" value="Oil Painting"><br>
            Water Color Painting <input type="checkbox" name="pref" id="pref" value="water color Painting"><br>
        </div>

        <div>
            <label for="occ">Select Occupation</label>
            <select name="occ" id="occ">
                <option value="student">Student</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <div>
            <label for="bio">Bio:</label>
            <textarea name="bio" id="bio" cols="30" rows="8"></textarea>
        </div>

        <div>
            <input type="reset" value="RESET">
            <input type="submit" value="SUBMIT">
        </div>

    </form>
</body>

</html>
