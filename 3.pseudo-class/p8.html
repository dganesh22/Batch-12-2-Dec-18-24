<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            padding: 10px;
        }

        p:first-child {
            background-color: green;
        }

        p:last-child {
            background-color: orange;
        }

        p:nth-child(3) {
            background-color: slateblue;
        }
    </style>
</head>

<body>
    <h1>:first-child , :last-child and :nth-child(position)</h1>


    <div>
        <p>paragraph - 1</p>
        <p>paragraph - 2</p>
        <p>paragraph - 3</p>
        <p>paragraph - 4</p>
        <p>paragraph - 5</p>
        <p>paragraph - 6</p>
    </div>
</body>

</html>
