<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: slategrey;
            height: 60px;
        }

        nav .container {
            width: 80%;
            height: 100%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        nav a.logo {
            text-decoration: none;
            color: #fff;
            font-size: 1.6rem;
        }

        nav .menu a {
            text-decoration: none;
            padding: 8px 10px;
            border: 2px solid #fff;
            cursor: pointer;
            color: #fff;
        }

        nav .menu a:hover {
            background-color: #fff;
            color: slategray;
        }
    </style>
</head>

<body>
    <nav>
        <div class="container">
            <a href="#" class="logo">Logo Here</a>

            <div class="menu">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Service</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </nav>
    <h1>border to anchor tag</h1>
</body>

</html>
