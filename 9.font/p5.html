<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            font-size: 1.2em;
        }

        .p1 {
            font-weight: 100;
        }

        .p2 {
            font-weight: 200;
        }

        .p3 {
            font-weight: 300;
        }

        .p4 {
            font-weight: 400;
        }

        .p5 {
            font-weight: 500;
        }

        .p6 {
            font-weight: 600;
        }

        .p7 {
            font-weight: 700;
        }

        .p8 {
            font-weight: 800;
        }

        .p9 {
            font-weight: 900;
        }

        .p10 {
            font-weight: bold;
        }

        .p11 {
            font-weight: light;
        }
    </style>
</head>

<body>
    <h2>font weight (100-900), bold,bolder,light,lighter </h2>

    <p class="p1">smaple text - 100 </p>
    <p class="p2">smaple text - 200</p>
    <p class="p3">smaple text - 300 </p>
    <p class="p4">smaple text - 400 </p>
    <p class="p5">smaple text - 500 </p>
    <p class="p6">smaple text - 600 </p>
    <p class="p7">smaple text - 700 </p>
    <p class="p8">smaple text - 800 </p>
    <p class="p9">smaple text - 900 </p>
    <p class="p10">smaple text - bold </p>
    <p class="p11">smaple text - light </p>
</body>

</html>
