<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>datalist</h1>

    <form action="">
        <div>
            <label for="city">Choose City Name</label>
            <input type="text" name="city" id="city" list="cityNames">
        </div>
        <div>
            <label for="phone">Phone numbers</label>
            <input type="text" name="phone" id="phone" list="phones">
        </div>
    </form>

    <datalist id="cityNames">
        <option value="bengaluru"></option>
        <option value="mysore"></option>
        <option value="davanagere"></option>
        <option value="mandya"></option>
    </datalist>

    <datalist id="phones">
        <option value="9966885544"></option>
        <option value="8966885544"></option>
        <option value="7966885511"></option>
        <option value="8996885511"></option>
    </datalist>
</body>

</html>
