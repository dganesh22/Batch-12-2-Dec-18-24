<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container h1:first-child {
            color: orange;
        }

        .container h1:last-child {
            color: deepskyblue;
        }

        .container h1:nth-child(3) {
            color: darkcyan;
        }

        .container1 h1:first-of-type {
            color: orangered;
        }

        .container1 h1:last-of-type {
            color: slateblue;
        }

        .container1 h1:nth-of-type(3) {
            color: orchid;
        }
    </style>
</head>

<body>
    <h1>:first-of-type and :last-of-type and nth-of-type</h1>

    <div class="container">
        <h1>title heading - 1</h1>
        <h1>title heading - 2</h1>
        <h1>title heading - 3</h1>
        <h1>title heading - 4</h1>
        <h1>title heading - 5</h1>
        <h1>title heading - 6</h1>
    </div>

    <hr>

    <div class="container1">
        <h1>header tag-1</h1>
        <p>para-1</p>
        <h1>header tag-2</h1>
        <p>para-2</p>
        <h1>header tag-3</h1>
        <p>para-3</p>
        <h1>header tag-4</h1>
        <p>para-4</p>
    </div>
</body>

</html>
