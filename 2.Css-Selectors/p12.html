<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        [class~="btn"] {
            background-color: teal;
            color: #fff;
            padding: 10px 12px;
            text-decoration: none;
            margin: 4px;
        }
    </style>
</head>

<body>
    <h1> [attr ~= value ] </h1>
    <!-- targets the value present at independent position, not combined with any other  -->

    <ul>
        <li class="btn">Item-1</li>
        <li class="add-btn">Item-2</li>
        <li class="btn_login">Item-3</li>
        <li class="btn link">Item-4</li>
        <li class="action btn">Item-5</li>
        <li class="alert-btn">Item-6</li>
    </ul>

</body>

</html>
