<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form div {
            margin: 10px;
        }
    </style>
</head>

<!-- getName -->

<body>
    <h1>form inputs</h1>

    <form action="" enctype="multipart/form-data">
        <div>
            <label for="">Text input</label>
            <input type="text" name="" id="">
        </div>

        <div>
            <label for="">Email input</label>
            <input type="email" name="" id="">
        </div>

        <div>
            <label for="">Number input</label>
            <input type="number" name="" id="">
        </div>

        <div>
            <label for="">Tel input (teletype) </label>
            <input type="tel" name="" id="">
        </div>

        <div>
            <label for="">Password</label>
            <input type="password" name="" id="">
        </div>

        <hr>

        <!-- date inputs -->
        <div>
            <label for="">Date</label>
            <input type="date" name="" id="">
        </div>

        <div>
            <label for="">datetime (manual entry) (d:m:y h:m) </label>
            <input type="datetime" name="" id="">
        </div>

        <div>
            <label for="">datetime-local</label>
            <input type="datetime-local" name="" id="">
        </div>

        <div>
            <label for="">Week</label>
            <input type="week" name="" id="">
        </div>

        <div>
            <label for="">month</label>
            <input type="month" name="" id="">
        </div>

        <div>
            <label for="">Time</label>
            <input type="time" name="" id="">
        </div>

        <hr>

        <div>
            <label for="">Search</label>
            <input type="search" name="" id="">
        </div>

        <div>
            <label for="">color</label>
            <input type="color" name="" id="">
        </div>

        <div>
            <label for="">Hidden input</label>
            <input type="hidden" name="">
        </div>

        <div>
            <label for="">File input</label>
            <input type="file" name="" id="" multiple>
        </div>

        <div>
            <label for="">URL address</label>
            <input type="url" name="" id="">
        </div>

        <div>
            <input type="submit" value="Submit"> <!-- default name is submit -->
            <input type="reset" value="Clear"><!-- default name reset -->
        </div>
    </form>
</body>

</html>
