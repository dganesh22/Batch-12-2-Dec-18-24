<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .txt {
            fill: green;
        }
    </style>
</head>

<body>
    <h1>Svg (Scalable Vector Graphics)</h1>

    <svg width="200" height="200">
        <circle cx="100" cy="100" r="50" stroke="red" stroke-width="8" fill="green"></circle>
    </svg>

    <hr>

    <svg width="200" height="200">
        <rect width="120" height="80" stroke="green" fill="deeppink" stroke-width="8"></rect>
    </svg>

    <hr>

    <svg viewBox="0 0 240 100" xmlns="https://www.w3.org/2000/svg">
        <text x="20" y="35" class="txt">Welcome to Svg Text</text>
    </svg>
</body>

</html>
