<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input[type="range"] {
            width: 100%;
        }
    </style>
</head>

<body>
    <h1>Range input</h1>

    <form action="">
        <div>
            <label for="">Select Range</label>
            <input type="range" name="weight" id="weight" value="0" min="0" max="100" step="0.5" onchange="getVal()"
                required>

            <strong id="out"></strong>
        </div>
    </form>
    <script>
        var weightEl = document.getElementById("weight");
        var outtEl = document.getElementById("out");

        function getVal() {
            outtEl.innerText = weightEl.value + " kg";
        };
    </script>
</body>

</html>
