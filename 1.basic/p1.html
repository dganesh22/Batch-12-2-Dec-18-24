<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- using style tag -->
    <style>
        /* header css */
        body {
            background-color: teal;
        }
    </style>
    <!-- external css -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- inline css -->
    <h1 style="color:white;text-transform: uppercase;">Cascading Style Sheets</h1>

</body>

</html>
