<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>iframe - embed map , youtube and another website </h1>

    <!-- embed youtube  -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/utRIZmKnMP0?si=qWp8b9ZaXm-2Zise"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <hr>

    <!-- embed google map -->
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d62201.488675454915!2d77.5275457!3d12.9978608!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae3ded0b360e07%3A0x7a7fb24a41a6b2b3!2sISKCON%20temple%20Bangalore!5e0!3m2!1sen!2sin!4v1735285801917!5m2!1sen!2sin"
        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

    <!-- embed another website -->
    <hr>

    <iframe src="https://be-practical.com" frameborder="0" width="800" height="400"></iframe>

</body>

</html>
