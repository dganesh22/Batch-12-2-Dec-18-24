<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>media tags</h1>
    <!-- audio and video -->

    <audio src="./audio.mp3" controls autoplay muted loop></audio>
    <!-- 
        these attributes are common for both audio and video
        controls => enable the player controls
        autoplay => enable the autoplay option
        muted = mutes the volume
        loop = loop the track 
    -->

    <hr>

    <video src="./a-video.mp4" width="400" height="200" controls></video>
</body>

</html>
