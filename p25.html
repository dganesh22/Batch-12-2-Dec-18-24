<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Progress tag</h1>
    <!-- to display download progress / uploading progress / network speed -->

    <!-- <progress></progress> -->
    <progress style="width: 100%;" min="0" max="100" value="0" id="prog"></progress>
    <h3 id="status"></h3>
    <script>
        let prog = document.getElementById("prog")
        let status = document.getElementById("status")
        let x = 0;

        function loadVal() {
            if (x <= 100) {
                prog.value = x;
                status.innerText = x + "%";
                x++;
                console.log(`x = `, x)
            }
        }

        setInterval(loadVal, 500)
    </script>
</body>

</html>
