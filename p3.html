<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <!-- meta tags - developer needs -->

    <!-- current active device screen resolution (widthxheight) in px -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- configure content type (utf-8) unicode text format - 8bits -->
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">

    <!-- browser compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- project /developer / template/ server -  descriptions -->
    <meta name="description" content="">
    <meta name="description" content="">

    <!-- SEO (Search Engine Optimization) keywords -->
    <meta name="keywords" content="">

    <!-- redirect (default) url -->
    <meta http-equiv="refresh" content="0; url=http://example.com">

    <!-- meta refresh rate -->
    <meta http-equiv="refresh" content="5">
</head>
<body>
    
</body>
</html>
