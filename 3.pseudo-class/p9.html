<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            padding: 10px;
        }

        p:nth-child(even) {
            background-color: orange;
        }

        p:nth-child(odd) {
            background-color: slateblue;
        }
    </style>
</head>

<body>
    <div>
        <p>paragraph - 1</p>
        <p>paragraph - 2</p>
        <p>paragraph - 3</p>
        <p>paragraph - 4</p>
        <p>paragraph - 5</p>
        <p>paragraph - 6</p>
    </div>
</body>

</html>
