<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            padding: 12px;
            font-size: 1.2rem;
            margin: 10px;
            border-top-color: orange;
            border-top-width: 15px;
        }

        .p1 {
            border-top-style: solid;
        }

        .p2 {
            border-top-style: dotted;
        }

        .p3 {
            border-top-style: dashed;
        }

        .p4 {
            border-top-style: inset;
        }

        .p5 {
            border-top-style: outset;
        }

        .p6 {
            border-top-style: groove;
        }

        .p7 {
            border-top-style: ridge;
        }

        .p8 {
            border-top-style: double;
        }
    </style>
</head>

<body>
    <h1>border-top , border-left, border-right, border-bottom </h1>
    <p class="p1">Solid</p>
    <p class="p2">dotted</p>
    <p class="p3">dashed</p>
    <p class="p4">inset</p>
    <p class="p5">outset</p>
    <p class="p6">groove</p>
    <p class="p7">ridge</p>
    <p class="p8">double</p>
</body>

</html>
