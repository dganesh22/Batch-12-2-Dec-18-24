<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        tr,
        td,
        th {
            border: 2px solid black;
            border-collapse: collapse;
        }

        td,
        th {
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1>border-collapse</h1>

    <table>
        <tr>
            <th>name</th>
            <th>email</th>
            <th>city</th>
        </tr>

        <tr>
            <td>John</td>
            <td>John@gmail.com</td>
            <td>Bengaluru</td>
        </tr>

        <tr>
            <td>Mary</td>
            <td>Mary@gmail.com</td>
            <td>Mysure</td>
        </tr>
    </table>
</body>

</html>
