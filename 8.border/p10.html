<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container div {
            width: 200px;
            height: 100px;
            margin: 20px;
            padding: 10px;
            border-width: 16px;
            /* border-color: orange; */
        }

        .b1 {
            border-inline-start: solid;
            border-inline-end: dotted;
        }

        .b2 {
            border-inline-start-width: 20px;
            border-inline-start-style: groove;
        }

        .b3 {
            border-inline-end-width: 20px;
            border-inline-end-style: ridge;
            border-inline-end-color: slateblue;
        }
    </style>
</head>

<body>
    <h1>border-inline</h1>

    <div class="container">
        <div class="b1">

</html>
