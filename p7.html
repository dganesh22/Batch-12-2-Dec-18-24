<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Marquee tag (deprecated) </h1>

    <!-- 
        moving text
        direction - 4 - up, down, right, left
        behaviour - scroll, slide, alternate, alternate-scroll, alternate-slide
        scrolldelay - delay time
        scrollamount - (0 - 100) - speed of movement
    -->

    <marquee behavior="scroll" direction="">This is scrolling text</marquee>
    <marquee behavior="slide" direction="">This is sliding text</marquee>
    <marquee behavior="alternate" direction="">This is alternate text</marquee>
    <marquee behavior="alternate-scroll" direction="">This is alternate-scroll text</marquee>
    <marquee behavior="alternate-slide" direction="">This is alternate-slide text</marquee>

    <hr>


    <marquee behavior="scroll" direction="right">Right moving text</marquee>
    <hr>
    <marquee behavior="scroll" direction="up">up moving text</marquee>
    <hr>
    <marquee behavior="scroll" direction="down">down moving text</marquee>
    <hr>

    <h3>speed</h3>
    <marquee behavior="scroll" direction="right" scrollamount="10">Speed of the text</marquee>
</body>
</html>
